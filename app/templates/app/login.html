{% extends 'app/base.html' %}
{% block title %}Вход — РепетиТут{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Вход</h2>
        <p class="auth-subtitle">Продолжите бронировать занятия</p>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>E-mail</label>
                <input type="text" name="username" placeholder="user@mail.ru" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" placeholder="Минимум 8 символов" required>
            </div>
            <button type="submit" class="btn-primary w-100">Войти</button>
        </form>
        <div class="auth-links"><a href="#">Забыли пароль?</a></div>
        <hr class="auth-divider">
        <div class="auth-footer">Нет аккаунта? <a href="#">Создать</a></div>
    </div>
</div>
{% endblock %}
