{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}РепетиТут{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <header class="header">
        <div class="container header-container">
            <a href="/" class="logo">
                <span class="logo-circle"></span>
                РепетиТут
            </a>
            <nav class="nav">
                <a href="/catalog/">Каталог</a>
                <a href="#">Как это работает</a>
                <a href="#">Для репетиторов</a>
            </nav>
            <div class="auth-buttons">
                <a href="/login/" class="btn-login">Войти</a>
                <a href="/register/" class="btn-register">Регистрация</a>
            </div>

            <button class="burger-menu" aria-label="Меню">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>


    <main>
        {% block content %}
        {% endblock %}
    </main>


    <footer class="footer">
        <div class="container footer-container">
            <p> 2026 РепетиТут</p>
            <p>support@repetitut.ru · +7 900 000-00-00</p>
        </div>
    </footer>

    <script src="{% static 'app/js/main.js' %}"></script>
</body>
</html>
